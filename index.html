
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>V ❤️ RSM CHAT</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:white;font-family:Arial,sans-serif}
button{cursor:pointer;color:inherit}
.app{max-width:480px;height:100dvh;margin:auto;display:flex;flex-direction:column;background:#000;overflow:hidden}

/* HEADER */
header{height:65px;display:flex;align-items:center;gap:12px;padding:0 13px;border-bottom:1px solid #252525;flex-shrink:0}
.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;font-weight:bold;font-size:19px;background:linear-gradient(135deg,#ff3b9d,#853bff);border:2px solid #ff5ca8}
.profile{flex:1}
.profile b{font-size:15px}
.profile small{display:block;color:#aaa;font-size:12px;margin-top:4px}
.header-actions{display:flex;gap:15px}
.header-actions button{background:none;border:0;font-size:22px}

/* CHAT */
#messages{flex:1;overflow-y:auto;padding:15px 12px;display:flex;flex-direction:column;gap:13px;scroll-behavior:smooth}
.welcome{margin:auto;text-align:center;color:#aaa;display:flex;align-items:center;flex-direction:column;gap:10px}
.big-avatar{width:85px;height:85px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,#ff3b9d,#853bff)}
.welcome b{color:white;font-size:19px}
.welcome p{font-size:13px}

.message-row{display:flex;align-items:flex-end;gap:7px;max-width:90%}
.message-row.mine{align-self:flex-end;flex-direction:row-reverse}
.message-row.theirs{align-self:flex-start}
.mini-avatar{width:25px;height:25px;border-radius:50%;background:#873bce;display:grid;place-items:center;font-size:11px;flex-shrink:0}

.bubble{min-width:45px;max-width:275px;padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.45;overflow-wrap:anywhere;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.mine .bubble{background:linear-gradient(135deg,#a832dc,#d62976);border-bottom-right-radius:5px}
.theirs .bubble{background:#262626;border-bottom-left-radius:5px}

.reply-quote{background:#0003;border-left:3px solid #ff82c4;border-radius:5px;padding:7px 9px;margin-bottom:8px;font-size:12px;color:#eee;overflow:hidden}
.reply-quote strong{display:block;margin-bottom:3px;color:#ffb4db}
.reply-quote div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.meta{text-align:right;font-size:10px;color:#ddd;margin-top:5px}
.reaction-display{margin-top:5px;font-size:13px;background:#222;border-radius:15px;display:inline-block;padding:3px 8px}

/* TYPING */
#typing{min-height:18px;padding:0 17px;font-size:12px;color:#aaa}

/* REPLY PREVIEW */
#replyBox{display:none;background:#191919;border-top:1px solid #333;padding:10px 15px;align-items:center;gap:10px}
.reply-line{width:3px;height:36px;background:#ff4ca5;border-radius:5px}
.reply-info{flex:1;min-width:0}
.reply-info b{display:block;color:#ff8cc6;font-size:12px;margin-bottom:4px}
.reply-info span{display:block;color:#ccc;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cancelReply{background:none;border:0;font-size:20px;color:#aaa}

/* INPUT */
footer{padding:10px 12px max(12px,env(safe-area-inset-bottom));border-top:1px solid #242424;background:#080808;flex-shrink:0}
.input-wrap{display:flex;align-items:center;gap:9px;padding:5px 7px 5px 17px;background:#252525;border:1px solid #383838;border-radius:30px}
#messageInput{flex:1;min-width:0;background:transparent;color:white;border:0;outline:none;font-size:15px;padding:11px 0}
#sendBtn{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(135deg,#ff3b9d,#853bff);font-size:20px}

/* LONG PRESS MENU */
#messageMenu{display:none;position:fixed;inset:0;z-index:30;background:#0009;align-items:flex-end;justify-content:center}
#messageMenu.show{display:flex}
.menu-panel{width:100%;max-width:480px;background:#202020;border-radius:23px 23px 0 0;padding:17px 16px max(30px,env(safe-area-inset-bottom));animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.reaction-bar{display:flex;justify-content:space-around;align-items:center;padding:12px 5px;background:#303030;border-radius:35px;margin-bottom:15px}
.reaction-bar button{background:none;border:0;font-size:27px;padding:4px}
.menu-item{width:100%;display:flex;align-items:center;gap:15px;padding:14px 10px;background:none;border:0;border-bottom:1px solid #333;text-align:left;font-size:15px}
.menu-item:last-child{border:0}
.menu-item span{font-size:20px;width:25px}
.menu-item.danger{color:#ff5364}

/* LOGIN */
#login{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;padding:22px;z-index:50}
.login-box{width:100%;max-width:340px;background:#151515;border:1px solid #292929;border-radius:22px;padding:28px;text-align:center}
.login-logo{font-size:25px;font-weight:bold;background:linear-gradient(45deg,#ff3b9d,#853bff);background-clip:text;color:transparent}
.login-box p{color:#999;font-size:13px}
.login-box input{display:block;width:100%;padding:14px;margin:12px 0;background:#252525;border:1px solid #444;border-radius:12px;color:white;outline:none}
.login-box button{width:100%;padding:14px;border:0;border-radius:12px;font-weight:bold;background:linear-gradient(45deg,#ff3b9d,#853bff)}
#error{color:#ff7777;font-size:12px;margin-top:12px}
</style>
</head>

<body>
<div class="app">

<header>
<button id="backBtn" style="background:none;border:0;font-size:26px">‹</button>
<div class="avatar" id="avatar">?</div>
<div class="profile">
<b id="personName">V & R</b>
<small id="status">Connecting...</small>
</div>
<div class="header-actions">
<button id="infoBtn">ⓘ</button>
<button id="logoutBtn">⋮</button>
</div>
</header>

<div id="messages">
<div class="welcome">
<div class="big-avatar">❤️</div>
<b>V & RSM CHAT</b>
<p>Your private conversation starts here.</p>
</div>
</div>

<div id="typing"></div>

<!-- REPLY PREVIEW -->
<div id="replyBox">
<div class="reply-line"></div>
<div class="reply-info">
<b id="replyName">Replying to V</b>
<span id="replyText"></span>
</div>
<button id="cancelReply">✕</button>
</div>

<footer>
<div class="input-wrap">
<input id="messageInput" placeholder="Message..." maxlength="2000" disabled>
<button id="sendBtn" disabled>➤</button>
</div>
</footer>
</div>

<!-- LONG PRESS OPTIONS -->
<div id="messageMenu">
<div class="menu-panel">
<div class="reaction-bar">
<button data-emoji="❤️">❤️</button>
<button data-emoji="😂">😂</button>
<button data-emoji="😍">😍</button>
<button data-emoji="😮">😮</button>
<button data-emoji="👍">👍</button>
<button data-emoji="🙏">🙏</button>
</div>
<div id="menuActions"></div>
</div>
</div>

<!-- LOGIN -->
<div id="login">
<div class="login-box">
<div class="login-logo">V ❤️ RSM CHAT</div>
<p>Private messaging for two</p>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Log In</button>
<div id="error"></div>
</div>
</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
 getAuth,signInWithEmailAndPassword,
 onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
 getDatabase,ref,push,set,onValue,update,remove,
 onDisconnect,serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyDw8RNPGTkKhOBJg_-xB7yuk0ruiBzP7qg",
 authDomain:"rsm-chat-7d0bf.firebaseapp.com",
 databaseURL:"https://rsm-chat-7d0bf-default-rtdb.firebaseio.com",
 projectId:"rsm-chat-7d0bf",
 storageBucket:"rsm-chat-7d0bf.firebasestorage.app",
 messagingSenderId:"372194443824",
 appId:"1:372194443824:web:e10ce6e3f073465d4a63f5",
 measurementId:"G-7K22EZRXZ3"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const $=id=>document.getElementById(id);

const V_EMAIL="radhe@315gmail.com";
const R_EMAIL="radhe@8780gmail.com";

let me=null;
let myName="";
let allMessages=[];
let replyTo=null;
let selectedMessage=null;
let stops=[];
let presenceRef=null;
let typingRef=null;
let typingTimer=null;

function allowed(email){
 return [V_EMAIL,R_EMAIL].includes((email||"").toLowerCase());
}
function nameOf(email){
 return email.toLowerCase()===V_EMAIL.toLowerCase()?"V":"R";
}

// LOGIN
$("loginBtn").onclick=async()=>{
 const email=$("email").value.trim().toLowerCase();
 const password=$("password").value;

 if(!allowed(email)){
  $("error").textContent="Only V and R can login.";
  return;
 }
 if(!password){
  $("error").textContent="Enter your password.";
  return;
 }

 $("loginBtn").disabled=true;
 try{
  await signInWithEmailAndPassword(auth,email,password);
  $("error").textContent="";
 }catch(e){
  $("error").textContent="Login failed. Check Email and Password.";
 }finally{
  $("loginBtn").disabled=false;
 }
};

// CLEANUP
function cleanup(){
 stops.forEach(fn=>fn());
 stops=[];
 clearTimeout(typingTimer);
}

// AUTH
onAuthStateChanged(auth,async user=>{
 cleanup();
 me=null;

 if(!user){
  $("login").style.display="flex";
  $("messageInput").disabled=true;
  $("sendBtn").disabled=true;
  $("messages").replaceChildren();
  $("typing").textContent="";
  return;
 }

 if(!allowed(user.email)){
  await signOut(auth);
  $("error").textContent="Account not allowed.";
  return;
 }

 me=user;
 myName=nameOf(user.email);

 $("personName").textContent=myName;
 $("avatar").textContent=myName;
 $("login").style.display="none";
 $("messageInput").disabled=false;
 $("sendBtn").disabled=false;

 // PRESENCE
 presenceRef=ref(db,"status/"+user.uid);

 await onDisconnect(presenceRef).set({
  online:false,
  email:user.email,
  lastSeen:serverTimestamp()
 });

 await set(presenceRef,{
  online:true,
  email:user.email,
  lastSeen:serverTimestamp()
 });

 // TYPING
 typingRef=ref(db,"typing/"+user.uid);
 await onDisconnect(typingRef).set(false);
 await set(typingRef,false);

 // ONLINE LISTENER
 stops.push(onValue(ref(db,"status"),snap=>{
  let online=false;
  snap.forEach(c=>{
   const v=c.val();
   if(v?.email?.toLowerCase()!==user.email.toLowerCase()&&v?.online===true){
    online=true;
   }
  });
  $("status").textContent=online?"● Active now":"Offline";
 }));

 // TYPING LISTENER
 stops.push(onValue(ref(db,"typing"),snap=>{
  let typing=false;
  snap.forEach(c=>{
   if(c.key!==user.uid&&c.val()===true)typing=true;
  });
  $("typing").textContent=typing?"Typing...":"";
 }));

 // MESSAGE LISTENER
 stops.push(onValue(ref(db,"messages"),async snap=>{
  const data=snap.val()||{};

  allMessages=Object.entries(data)
   .map(([id,m])=>({id,...m}))
   .sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));

  renderMessages();

  const changes={};
  allMessages.forEach(m=>{
   if(m.senderUid!==user.uid&&m.seen!==true){
    changes["messages/"+m.id+"/seen"]=true;
   }
  });

  if(Object.keys(changes).length){
   try{await update(ref(db),changes)}
   catch(e){console.error(e)}
  }
 }));
});

// RENDER MESSAGES
function renderMessages(){
 const box=$("messages");
 box.replaceChildren();

 if(!allMessages.length){
  const w=document.createElement("div");
  w.className="welcome";

  const av=document.createElement("div");
  av.className="big-avatar";
  av.textContent="❤️";

  const title=document.createElement("b");
  title.textContent="V & RSM CHAT";

  const p=document.createElement("p");
  p.textContent="Your private conversation starts here.";

  w.append(av,title,p);
  box.appendChild(w);
  return;
 }

 allMessages.forEach(m=>{
  const mine=m.senderUid===me?.uid;

  const row=document.createElement("div");
  row.className="message-row "+(mine?"mine":"theirs");

  if(!mine){
   const av=document.createElement("div");
   av.className="mini-avatar";
   av.textContent=m.senderName||"R";
   row.appendChild(av);
  }

  const bubble=document.createElement("div");
  bubble.className="bubble";

  // ORIGINAL MESSAGE PREVIEW FOR REPLY
  if(m.replyText){
   const q=document.createElement("div");
   q.className="reply-quote";

   const author=document.createElement("strong");
   author.textContent=m.replyName||"Reply";

   const original=document.createElement("div");
   original.textContent=m.replyText;

   q.append(author,original);

   q.onclick=()=>{
    const target=document.getElementById("msg-"+m.replyId);
    if(target){
     target.scrollIntoView({behavior:"smooth",block:"center"});
    }
   };

   bubble.appendChild(q);
  }

  const content=document.createElement("div");
  content.textContent=m.text||"";
  bubble.appendChild(content);

  const meta=document.createElement("div");
  meta.className="meta";

  const time=m.timestamp?
   new Date(m.timestamp).toLocaleTimeString("en-IN",{
    hour:"2-digit",minute:"2-digit"
   }):"Sending...";

  meta.textContent=time+(mine?
   (m.edited?" · Edited":"")+
   (m.seen?" · Seen ✓✓":" · Sent ✓"):"");

  bubble.appendChild(meta);

  // REACTIONS
  if(m.reactions){
   const r=document.createElement("div");
   r.className="reaction-display";

   const counts={};
   Object.values(m.reactions).forEach(e=>{
    counts[e]=(counts[e]||0)+1;
   });

   r.textContent=Object.entries(counts)
    .map(([e,n])=>e+" "+n).join(" ");

   bubble.appendChild(r);
  }

  bubble.id="msg-"+m.id;

  // LONG PRESS
  let timer=null;

  bubble.addEventListener("contextmenu",e=>{
   e.preventDefault();
   openMessageMenu(m,mine);
  });

  bubble.addEventListener("pointerdown",e=>{
   if(e.pointerType==="mouse"&&e.button!==0)return;
   timer=setTimeout(()=>{
    openMessageMenu(m,mine);
   },500);
  });

  ["pointerup","pointerleave","pointercancel"].forEach(event=>{
   bubble.addEventListener(event,()=>clearTimeout(timer));
  });

  row.appendChild(bubble);
  box.appendChild(row);
 });

 box.scrollTop=box.scrollHeight;
}

// OPEN INSTAGRAM MENU
function openMessageMenu(m,mine){
 selectedMessage=m;

 const actions=$("menuActions");
 actions.replaceChildren();

 function addAction(icon,label,callback,danger=false){
  const b=document.createElement("button");
  b.className="menu-item"+(danger?" danger":"");

  const s=document.createElement("span");
  s.textContent=icon;

  b.append(s,document.createTextNode(label));

  b.onclick=()=>{
   closeMessageMenu();
   callback();
  };

  actions.appendChild(b);
 }

 addAction("↩️","Reply",()=>setReply(m));

 addAction("📋","Copy",async()=>{
  try{
   await navigator.clipboard.writeText(m.text||"");
  }catch(e){
   alert("Copy not supported.");
  }
 });

 if(mine){
  addAction("✏️","Edit",()=>editMessage(m));
  addAction("🗑️","Unsend",()=>deleteMessage(m),true);
 }

 $("messageMenu").classList.add("show");
}

// CLOSE MENU
function closeMessageMenu(){
 $("messageMenu").classList.remove("show");
 selectedMessage=null;
}

$("messageMenu").addEventListener("click",e=>{
 if(e.target===$("messageMenu"))closeMessageMenu();
});

// REACTIONS
document.querySelectorAll("[data-emoji]").forEach(b=>{
 b.onclick=()=>{
  if(selectedMessage){
   react(selectedMessage,b.dataset.emoji);
   closeMessageMenu();
  }
 };
});

// REPLY PREVIEW
function setReply(m){
 replyTo=m;

 $("replyName").textContent="Replying to "+m.senderName;
 $("replyText").textContent=m.text;
 $("replyBox").style.display="flex";

 $("messageInput").focus();
}

$("cancelReply").onclick=()=>{
 replyTo=null;
 $("replyBox").style.display="none";
};

// SEND MESSAGE
async function sendMessage(){
 const text=$("messageInput").value.trim();
 if(!text||!me)return;

 $("sendBtn").disabled=true;

 try{
  const data={
   text,
   senderUid:me.uid,
   senderName:myName,
   timestamp:serverTimestamp(),
   seen:false,
   edited:false
  };

  if(replyTo){
   data.replyId=replyTo.id;
   data.replyText=replyTo.text;
   data.replyName=replyTo.senderName;
  }

  await push(ref(db,"messages"),data);

  $("messageInput").value="";
  replyTo=null;
  $("replyBox").style.display="none";

  await set(typingRef,false);

 }catch(e){
  alert("Message failed: "+e.message);
 }finally{
  $("sendBtn").disabled=false;
 }
}

$("sendBtn").onclick=sendMessage;

$("messageInput").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

// TYPING
$("messageInput").addEventListener("input",async()=>{
 if(!me||!typingRef)return;

 try{
  await set(typingRef,true);
  clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>set(typingRef,false),1800);
 }catch(e){
  console.error(e);
 }
});

// REACTION
async function react(m,emoji){
 if(!me)return;

 const current=m.reactions?.[me.uid];

 try{
  await set(
   ref(db,"messages/"+m.id+"/reactions/"+me.uid),
   current===emoji?null:emoji
  );
 }catch(e){
  alert("Reaction failed.");
 }
}

// EDIT
async function editMessage(m){
 if(!me||m.senderUid!==me.uid)return;

 const value=prompt("Edit your message:",m.text);
 if(value===null||!value.trim())return;

 try{
  await update(ref(db,"messages/"+m.id),{
   text:value.trim(),
   edited:true
  });
 }catch(e){
  alert("Edit failed.");
 }
}

// UNSEND
async function deleteMessage(m){
 if(!me||m.senderUid!==me.uid)return;

 if(!confirm("Unsend this message for everyone?"))return;

 try{
  await remove(ref(db,"messages/"+m.id));
 }catch(e){
  alert("Unsend failed.");
 }
}

// INFO
$("infoBtn").onclick=()=>{
 alert("V ❤️ RSM CHAT\nPrivate Chat for V and R.");
};

// LOGOUT
async function logout(){
 if(!me)return;

 try{
  await set(typingRef,false);
  await set(presenceRef,{
   online:false,
   email:me.email,
   lastSeen:serverTimestamp()
  });
  await signOut(auth);
 }catch(e){
  alert("Logout failed.");
 }
}

$("logoutBtn").onclick=()=>{
 if(confirm("Logout from V RSM Chat?"))logout();
};

$("backBtn").onclick=()=>{
 if(confirm("Logout from chat?"))logout();
};

</script>
</body>
</html>
